<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="gerador de senhas, password generator">
    <title>Password Generator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1 class="titulo">CUTE PASSWORD GENERATOR</h1>
    <h2>Generate strong and secure passwords. Choose the type, set the options, and click "GENERATE".</h2>

    <main class="container-input">

        <!-- Seletor de tipo de senha -->
        <div class="form-row">
            <label for="tipo-senha">Type</label>
            <select id="tipo-senha" class="input-select">
                <option value="geral">General password</option>
                <option value="cartao">Credit card password</option>
            </select>
        </div>

        <!-- Grupo: senha geral (tamanho) -->
        <div id="grupo-tamanho" class="form-row">
            <label for="tamanho">Length:</label>
            <input
                id="tamanho"
                class="input-numero"
                type="number"
                min="5"
                max="50"
                value="12"
            />
            <span>characters</span>
        </div>

        <!-- Grupo: senha de cartão (4 ou 6 dígitos) -->
        <div id="grupo-cartao" class="form-row hide">
            <label for="digitos-cartao">Digits:</label>
            <select id="digitos-cartao" class="input-select input-select-small">
                <option value="4">4 digits</option>
                <option value="6">6 digits</option>
            </select>
        </div>

        <button id="button" class="button-cta">Generate</button>
    </main>

    <div id="container-password" class="container-password hide">
        <span class="title">Your password is:</span>
        <span id="password" class="password"></span>
        <button id="copy-button" class="copy-button">Copy</button>
    </div>

    <script src="script.js" defer></script>

</body>
</html>
