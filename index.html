<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="gerador de senhas, password generator">
    <title>Password Generator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1 class="titulo">PASSWORD GENERATOR</h1>
    <h2>Generate strong and secure passwords. Choose the length and click "GENERATE".</h2>

    <main class="container-input">

        <label for="tamanho"> Length: </label>
        <input 
            id="tamanho" 
            class="input-numero" 
            type="number" 
            min="5" 
            max="50" 
            value="5" 
        />
        <span> characters </span>

        <button id="button" class="button-cta">Generate</button>
    </main>

    <div id="container-password" class="container-password hide">

        <span class="title"> Your password is: </span>
        <span id="password" class="password"></span>

        <button id="copy-button" class="copy-button">Copy</button>

    </div>

    <script src="script.js" defer></script>

</body>

</html>
